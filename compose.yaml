services:
  triplens:
    build: .
    image: triplens:latest
    container_name: triplens
    ports:
      - "8090:8090"
    environment:
      TRIPLENS_REGION: syd
      # TRIPLENS_API_BASE: https://example.invalid      # override the data service
      # TRIPLENS_CACHE: /data
    volumes:
      - triplens-cache:/data
      # If the container has no outbound access (e.g. a host VPN that only
      # captures the host's own traffic), seed the cache from the host instead:
      #   - ./.tdb-cache:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8090/api/meta', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    # optional hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  triplens-cache:
